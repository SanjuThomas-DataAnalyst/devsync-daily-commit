name: DevSync Daily Commit

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

jobs:
  commit-job:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Step with email 24ds1000027@ds.study.iitm.ac.in
        run: echo "Workflow running"

      - name: Create log file
        run: |
          echo "Updated on $(date)" >> log.txt

      - name: Commit and push
        run: |
          git config user.name "DevSync Bot"
          git config user.email "24ds1000027@ds.study.iitm.ac.in"
          git add log.txt
          git commit -m "Automated daily commit"
          git push
